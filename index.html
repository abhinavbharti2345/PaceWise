<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#18181b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>PaceWise</title>
  </head>
  <body style="margin: 0; background-color: #09090b;">
    <div id="root">
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #09090b; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif; user-select: none;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; width: 100px; height: 100px; background-color: rgba(255, 69, 58, 0.3); border-radius: 28px; filter: blur(20px);"></div>
          <div style="position: relative; width: 88px; height: 88px; background-color: #FF453A; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center;">
            <span style="color: #ffffff; font-size: 46px; font-weight: 900; line-height: 1; letter-spacing: -0.05em;">P</span>
          </div>
        </div>
        <div style="margin-top: 24px; text-align: center;">
          <div style="font-size: 32px; font-weight: 900; letter-spacing: -0.025em; line-height: 1; color: #ffffff;">
            <span>Pace</span><span style="color: #FF453A;">Wise</span>
          </div>
          <div style="font-size: 11px; font-weight: 900; letter-spacing: 0.25em; color: #71717a; text-transform: uppercase; margin-top: 8px;">
            PERSONAL BUDGET
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
